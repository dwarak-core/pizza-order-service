<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍕 Pizza Order Builder</h1>
        </header>

        <main>
            <!-- Build a line item -->
            <section class="card" id="builder-section">
                <h2>Add a Pizza</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="size-select">Size</label>
                        <select id="size-select"></select>
                    </div>
                    <div class="form-group">
                        <label for="quantity-input">Qty</label>
                        <input type="number" id="quantity-input" min="1" value="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Toppings</label>
                    <div id="toppings-container" class="toppings-grid"></div>
                </div>
                <button id="add-item-btn" class="btn btn-primary">Add to Order</button>
            </section>

            <!-- Current order -->
            <section class="card" id="order-section">
                <h2>Your Order</h2>
                <div id="order-items"></div>
                <p id="no-items-msg" class="muted">No items yet — add a pizza above.</p>

                <div id="extras-section" style="display:none">
                    <hr>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="promo-input">Promo Code</label>
                            <div class="input-row">
                                <input type="text" id="promo-input">
                                <button id="apply-promo-btn" class="btn btn-sm">Apply</button>
                            </div>
                            <div id="promo-error" class="field-error" style="display:none"></div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tip-mode">Tip</label>
                            <select id="tip-mode">
                                <option value="">No Tip</option>
                                <option value="DOLLAR">$ Amount</option>
                                <option value="PERCENTAGE">% Percentage</option>
                            </select>
                        </div>
                        <div class="form-group" id="tip-value-group" style="display:none">
                            <label for="tip-value" id="tip-value-label">Amount</label>
                            <input type="number" id="tip-value" min="0" step="0.01" value="0">
                        </div>
                    </div>

                    <!-- Pricing summary -->
                    <div id="pricing-summary">
                        <div class="price-line"><span>Subtotal</span><span id="p-subtotal">$0.00</span></div>
                        <div class="price-line discount-line" id="discount-row" style="display:none">
                            <span id="discount-label">Discount</span><span id="p-discount">-$0.00</span>
                        </div>
                        <div class="price-line"><span>Tax (6.5%)</span><span id="p-tax">$0.00</span></div>
                        <div class="price-line" id="tip-row" style="display:none">
                            <span>Tip</span><span id="p-tip">$0.00</span>
                        </div>
                        <div class="price-line total-line"><span>Total</span><span id="p-total">$0.00</span></div>
                    </div>

                    <div class="actions">
                        <button id="submit-btn" class="btn btn-primary">Submit Order</button>
                    </div>
                </div>
            </section>

            <!-- Order status (shown after submit) -->
            <section class="card" id="status-section" style="display:none">
                <h2>Order Submitted!</h2>
                <p>Order ID: <strong id="display-order-id"></strong></p>
                <p>Status: <span id="display-status" class="badge"></span></p>
                <div class="actions">
                    <button id="refresh-status-btn" class="btn btn-sm">Refresh Status</button>
                    <button id="cancel-order-btn" class="btn btn-sm btn-danger">Cancel Order</button>
                    <button id="new-order-btn" class="btn btn-primary">New Order</button>
                </div>
            </section>
        </main>

        <!-- Toast notifications -->
        <div id="toast" class="toast" style="display:none"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
